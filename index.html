<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windows 95</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Add React for Upload Center -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Add uploadCenter.js with type="text/babel" -->
  <script type="text/babel" src="uploadCenter.js"></script>

  <script src="startup.js"></script>
  <script src="windows95.js"></script>
</head>
<body>
  <div id="startup-screen">
    <img src="videoframe_3987.png" alt="Windows 95 Startup">
    <button id="start-os" class="start-os-button">Start Windows 95</button>
  </div>
  <div id="desktop" style="display: none">
    <div class="icons" oncontextmenu="event.stopPropagation()">
      <div class="icon" ondblclick="openUploadCenter()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="24" height="24" fill="#fff" stroke="#000"/>
          <path d="M16 8 L16 20 M10 14 L16 8 L22 14" stroke="#000" fill="none" stroke-width="2"/>
          <line x1="8" y1="24" x2="24" y2="24" stroke="#000" stroke-width="2"/>
        </svg>
        <span>Upload Center</span>
      </div>
      <div class="icon" ondblclick="openMyComputer()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="8" width="24" height="16" fill="#fff" stroke="#000"/>
          <rect x="8" y="4" width="16" height="8" fill="#fff" stroke="#000"/>
          <circle cx="16" cy="16" r="4" fill="#000"/>
        </svg>
        <span>My Computer</span>
      </div>
      <div class="icon" ondblclick="openYouTube()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="24" height="24" fill="#FF0000"/>
          <polygon points="13,10 13,22 22,16" fill="white"/>
        </svg>
        <span>YouTube</span>
      </div>
      <div class="icon" ondblclick="openGamesFolder()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="24" height="24" fill="#fff" stroke="#000"/>
          <rect x="8" y="8" width="16" height="16" fill="#FFD700"/>
          <text x="16" y="19" font-size="10" text-anchor="middle">🎮</text>
        </svg>
        <span>Games</span>
      </div>
      <div class="icon" ondblclick="openNotepad()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="20" height="24" fill="#fff" stroke="#000" />
          <rect x="8" y="4" width="20" height="24" fill="#fff" stroke="#000" />
          <line x1="12" y1="10" x2="24" y2="10" stroke="#000" />
          <line x1="12" y1="14" x2="24" y2="14" stroke="#000" />
          <line x1="12" y1="18" x2="20" y2="18" stroke="#000" />
        </svg>
        <span>Microsoft Express</span>
      </div>
      <div class="icon" ondblclick="openSettings()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <circle cx="16" cy="16" r="12" fill="#fff" stroke="#000"/>
          <circle cx="16" cy="16" r="3" fill="#000"/>
          <path d="M16 4 L18 8 L14 8 Z" fill="#000"/>
          <path d="M16 28 L18 24 L14 24 Z" fill="#000"/>
          <path d="M4 16 L8 18 L8 14 Z" fill="#000"/>
          <path d="M28 16 L24 18 L24 14 Z" fill="#000"/>
        </svg>
        <span>Settings</span>
      </div>
      <div class="icon" ondblclick="openInternetExplorer()">
        <img src="images (1).png" width="32" height="32" alt="Internet Explorer">
        <span>Internet Explorer</span>
      </div>
      <div class="icon" ondblclick="openReadme()">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <rect x="4" y="4" width="20" height="24" fill="#fff" stroke="#000"/>
          <rect x="8" y="4" width="20" height="24" fill="#fff" stroke="#000"/>
          <line x1="12" y1="10" x2="24" y2="10" stroke="#000"/>
          <line x1="12" y1="14" x2="24" y2="14" stroke="#000"/>
          <line x1="12" y1="18" x2="20" y2="18" stroke="#000"/>
        </svg>
        <span>README.txt</span>
      </div>
    </div>
    <div id="windows"></div>
    <div id="taskbar">
      <div id="start-btn">
        <img src="Screenshot 2025-01-15 192227.png" class="start-btn-logo">
      </div>
      <div class="taskbar-items"></div>
      <div class="system-tray">
        <div id="clock"></div>
      </div>
    </div>
    <div id="start-menu" class="hidden">
      <div class="start-menu-logo">
        <img src="Screenshot 2025-01-15 192227.png">
        Windows 95
      </div>
      <div class="start-menu-items">
        <div class="start-item" onclick="openSettings()">
          <span>Settings</span>
          <span>▶</span>
        </div>
        <div class="start-item" onclick="openMyComputer()">
          <span>My Computer</span>
          <span>▶</span>
        </div>
        <div class="start-item" onclick="openGamesFolder()">
          <span>Games</span>
          <span>▶</span>
        </div>
        <div class="start-item" onclick="openUploadCenter()">
          <span>Upload Center</span>
          <span>▶</span>
        </div>
        <div class="start-item" onclick="openInternetExplorer()">
          <span>Internet Explorer</span>
          <span>▶</span>
        </div>
        <div class="separator"></div>
        <div class="start-item" onclick="showShutdownDialog()">
          <span>Shut Down...</span>
        </div>
      </div>
    </div>
  </div>
  
  <audio id="startup-sound" preload="auto">
    <source src="o95.wav" type="audio/wav">
    <p>Your browser doesn't support HTML5 audio.</p>
  </audio>
  
  <audio id="fail-sound" preload="auto">
    <source src="o95.wav" type="audio/wav">
    <p>Your browser doesn't support HTML5 audio.</p>
  </audio>
  
  <script>
    window.addEventListener('message', function(event) {
      // Only accept messages from trusted sources
      if (event.origin !== window.location.origin) return;
      
      const frame = document.getElementById('ie-frame');
      if (!frame) return;
      
      switch(event.data.action) {
        case 'back':
          try { frame.contentWindow.history.back(); } catch(e) { console.log(e); }
          break;
        case 'forward':
          try { frame.contentWindow.history.forward(); } catch(e) { console.log(e); }
          break;
      }
    });
  </script>
</body>
</html>
