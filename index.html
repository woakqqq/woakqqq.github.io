<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生积分系统</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.font.im/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="frosted-glass"></div>
    <div class="background-animation" id="backgroundAnimation">
    </div>
    
    <div class="container">
        <h1>课堂积分评分系统</h1>
        
        <div class="controls">
            <div class="add-student-controls">
                <input type="text" id="studentNameInput" placeholder="输入学生姓名">
                <button id="addStudent">➕ 添加学生</button>
            </div>
            <button id="saveData">💾 保存数据</button>
            <button id="loadData">📂 加载数据</button>
        </div>
        
        <div class="student-list">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>积分</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                    <!-- 学生数据将在这里动态生成 -->
                </tbody>
            </table>
        </div>
    </div>
    
    <div id="pointsModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>课堂表现评分</h2>
            <div class="student-name" id="modalStudentName"></div>
            <div class="points-options">
                <button class="point-btn" data-value="1">回答问题 +1</button>
                <button class="point-btn" data-value="2">积极参与 +2</button>
                <button class="point-btn" data-value="3">帮助同学 +3</button>
                <button class="point-btn" data-value="5">优秀表现 +5</button>
                <button class="point-btn negative" data-value="-1">注意力不集中 -1</button>
                <button class="point-btn negative" data-value="-2">扰乱秩序 -2</button>
            </div>
            <div class="custom-points">
                <label for="customPoints">自定义分数:</label>
                <input type="number" id="customPoints" min="-10" max="10">
                <button id="addCustomPoints">添加</button>
            </div>
        </div>
    </div>
    
    <script type="module" src="config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
